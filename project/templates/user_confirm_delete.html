{% extends 'base.html' %}
{% load static %}

{% block title %}تأكيد حذف المستخدم{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i>تأكيد الحذف</h4>
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="bi bi-person-x display-1 text-danger"></i>
                    </div>
                    <h5>هل أنت متأكد من حذف المستخدم التالي؟</h5>
                    <div class="alert alert-warning mt-3">
                        <strong>اسم المستخدم:</strong> {{ user.username }}<br>
                    
                    </div>
                    <p class="text-danger small"> تحذير: هذا الإجراء لا يمكن التراجع عنه!</p>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="submit" class="btn btn-danger px-4">
                                <i class="bi bi-trash3 me-1"></i> نعم، احذف
                            </button>
                            <a href="{% url 'user_list' %}" class="btn btn-secondary px-4">
                                <i class="bi bi-x-circle me-1"></i> إلغاء
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
