<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - نظام إدارة المعهد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<style>
* { font-family: 'Cairo', sans-serif; }
body {
  background: linear-gradient(135deg, #1a2236 0%, #2a3550 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.login-card {
  background: #fff; border-radius: 20px;
  padding: 2.5rem 2rem; width: 100%; max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.logo {
  width: 64px; height: 64px; border-radius: 16px;
  background: #d90429; display: inline-flex;
  align-items: center; justify-content: center;
  font-size: 2rem; font-weight: 900; color: #fff;
}
.btn-login {
  background: #d90429; border: none; color: #fff;
  font-weight: 700; font-size: 1.05rem; padding: .75rem;
  border-radius: 10px; width: 100%; transition: background .2s;
}
.btn-login:hover { background: #b50022; }
.form-control {
  border-radius: 10px; padding: .7rem 1rem;
  border: 1.5px solid #e5e7eb; font-family: 'Cairo', sans-serif;
}
.form-control:focus { border-color: #d90429; box-shadow: 0 0 0 3px rgba(217,4,41,.1); }
.form-label { font-weight: 600; font-size: .9rem; color: #374151; }
.messages-container {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  width: 90%;
  max-width: 500px;
  animation: slideDown 0.5s ease;
}
@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(-100px);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
}
.alert-custom {
  padding: 1rem 1.25rem;
  border-radius: 12px;
  margin-bottom: 10px;
  border: none;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  animation: shake 0.5s ease;
}
.alert-custom.success {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: white;
  border-right: 4px solid #047857;
}
.alert-custom.error {
  background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
  color: white;
  border-right: 4px solid #b91c1c;
}
.alert-custom.warning {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: white;
  border-right: 4px solid #b45309;
}
.alert-custom.info {
  background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
  color: white;
  border-right: 4px solid #1d4ed8;
}
.alert-custom.debug {
  background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
  color: white;
}
.alert-icon {
  font-size: 1.5rem;
  margin-left: 12px;
}
.alert-message {
  flex: 1;
  font-weight: 500;
  font-size: 0.95rem;
}
.close-alert {
  background: none;
  border: none;
  color: white;
  font-size: 1.25rem;
  cursor: pointer;
  opacity: 0.8;
  transition: opacity 0.2s;
  padding: 0 5px;
}
.close-alert:hover {
  opacity: 1;
}
</style>
</head>
<body>
  {% if messages %}
<div class="messages-container">
  {% for message in messages %}
  <div class="alert-custom {{ message.tags }} fade show" role="alert">
    <div style="display: flex; align-items: center; flex: 1;">
      
      <span class="alert-message">{{ message }}</span>
    </div>
    <button type="button" class="close-alert" onclick="this.parentElement.remove()">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
<div class="login-card text-center">
  <div class="mb-3">
    <h4 class="fw-bold">تسجيل الدخول</h4>
    <p class="text-muted small">معهد الجبل العالي</p>
  </div>

 

  <form method="post" class="text-start">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">اسم المستخدم</label>
      <input type="text" name="username" id="username"  class="form-control" placeholder="أدخل اسم المستخدم" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label">كلمة المرور</label>
      <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login">دخول</button>
  </form>
  <p class="text-muted mt-4 mb-0 small">جميع الحقوق محفوظة &copy; 2026  معهد الجبل العالي</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
