{% extends 'base.html' %}
{% block title %}تأكيد الحذف{% endblock %}
{% block content %}
<div class="page-header">
  <h2>تأكيد الحذف</h2>
</div>
<div class="table-card p-4" style="max-width:500px;">
  <div class="d-flex align-items-center gap-3 mb-4">
    <div style="width:52px;height:52px;border-radius:50%;background:#fee2e2;color:#991b1b;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;">
      <i class="bi bi-exclamation-triangle"></i>
    </div>
    <div>
      <h5 class="fw-bold mb-1">هل أنت متأكد من الحذف؟</h5>
      <p class="text-muted mb-0">هذا الإجراء لا يمكن التراجع عنه.</p>
    </div>
  </div>
  {% if object %}
  <div class="alert" style="background:#fef3c7;border:1px solid #fbbf24;color:#92400e;border-radius:8px;font-size:.9rem;">
    <strong>العنصر المراد حذفه:</strong> {{ object }}
  </div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger px-4">
        <i class="bi bi-trash me-1"></i> نعم، احذف
      </button>
      <a href="javascript:history.back()" class="btn btn-outline-secondary">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}
